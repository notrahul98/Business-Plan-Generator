{% extends "base.html" %}
{% block main %}
<section class="login">
  <h1>Sign in</h1>
  {% if not configured %}
  <p class="flash error">No password is set up yet. Ask IT to run <code>kns-plan hash-password</code> and set
    <code>KNS_PASSWORD_HASH</code> on the server.</p>
  {% else %}
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Your name <small>(shown in version history)</small><input name="name" autocomplete="name"></label>
    <label>Office password<input type="password" name="password" autofocus autocomplete="current-password"></label>
    <button class="primary">Sign in</button>
  </form>
  {% endif %}
</section>
{% endblock %}
