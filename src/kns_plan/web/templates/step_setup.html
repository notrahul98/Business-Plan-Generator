{% extends "base.html" %}
{% from "_grid.html" import save %}
{% block main %}
{% set s = plan.settings %}
<h1>1. Brand &amp; market</h1>
<form method="post" class="card narrow" data-dirty>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="two">
    <label>Brand<input name="brand" value="{{ s.brand }}" required></label>
    <label>Country of origin<input name="origin" value="{{ s.origin }}"></label>
    <label>Incoterm of the brand price<input name="incoterm" value="{{ s.incoterm }}" placeholder="FOB Korea, EXW Spain…"></label>
    <label>HS code<input name="hs_code" value="{{ s.hs_code }}"></label>
    <label>Brand currency<input name="brand_currency" value="{{ s.brand_currency }}" maxlength="3"></label>
    <label>Exchange rate (IDR per 1 {{ s.brand_currency }})<input name="fx_rate" value="{{ s.fx_rate | num }}" inputmode="decimal" required></label>
    <label>VAT on sales (%)<input name="vat_rate" value="{{ (s.vat_rate * 100) | num }}" inputmode="decimal"></label>
    <label>Round retail prices up to
      <select name="rounding_step">{% for v, l in [(0, 'no rounding'), (100, '100 IDR'), (500, '500 IDR'), (1000, '1,000 IDR')] %}
        <option value="{{ v }}" {{ 'selected' if s.rounding_step == v }}>{{ l }}</option>{% endfor %}</select></label>
  </div>
  <h2>Plan period</h2>
  <div class="three">
    <label>First month
      <select name="start_month">{% for m in ['January','February','March','April','May','June','July','August','September','October','November','December'] %}
        <option value="{{ loop.index }}" {{ 'selected' if s.start_month == loop.index }}>{{ m }}</option>{% endfor %}</select></label>
    <label>First year<input name="start_year" value="{{ s.start_year }}" inputmode="numeric"></label>
    <label>Length
      <select name="years">{% for y in range(1, 6) %}<option value="{{ y }}" {{ 'selected' if s.years == y }}>{{ y }} year{{ 's' if y > 1 }}</option>{% endfor %}</select></label>
  </div>
  <label class="short">Stock cover target (months of next year's sales)<input name="stock_cover_months" value="{{ s.stock_cover_months | num }}" inputmode="decimal"></label>
  {{ save('pricing') }}
</form>
<form method="post" action="/plans/{{ row.id }}/rename" class="card narrow">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Plan name<input name="name" value="{{ row.name }}"></label>
  <button>Rename</button>
</form>
{% endblock %}
