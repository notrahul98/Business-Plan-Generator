[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kns-plan"
version = "0.1.0"
description = "Generates KNS market-entry business plan workbooks with live Excel formulas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "formulas>=1.2",  # fallback recalculation when LibreOffice is not installed
]

[project.scripts]
kns-plan = "kns_plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kns_plan.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
